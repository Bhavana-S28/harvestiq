<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HarvestIQ helps food-service teams record, understand and reduce food waste through meaningful analytics.">
    <title>HarvestIQ | Add Location</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div class="container">
            <h1 th:text="${restaurantLocation.id == null ? 'Add Location' : 'Edit Location'}">Location</h1>
        </div>
    </header>

    <main class="container">
        <nav th:replace="~{fragments/nav :: dashboardNav('locations')}"></nav>
        <form class="card" th:object="${restaurantLocation}" th:action="@{/admin/locations}" method="post">

            <input type="hidden" th:field="*{id}">

            <label for="name">Name:</label>
            <input id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
            </p>
            <button class="btn btn-primary" type="submit"
                th:text="${restaurantLocation.id == null ? 'Add Location' : 'Update Location'}">Save</button>
            <a class="btn btn-secondary" th:href="@{/admin/locations}">Cancel</a>

        </form>
    </main>
</body>

</html>
