<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HarvestIQ helps food-service teams record, understand and reduce food waste through meaningful analytics.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>HarvestIQ | Manage Locations</title>
</head>

<body>
    <header>
        <div class="container">
            <h1>Manage Locations</h1>
        </div>
    </header>

    <main class="container">

        <div th:replace="~{fragments/nav :: dashboardNav('locations')}"></div>
        
        <div class="page-actions actions-spacing">
            <a class="btn btn-primary" th:href="@{/admin/locations/new}">Add Location</a>
        </div>

        <p class="field-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <table class="card">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Location Name</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="location : ${restaurantLocations}">
                    <td th:text="${location.id}"></td>
                    <td th:text="${location.name}"></td>
                    <td>
                        <a class="btn btn-secondary btn-small"
                            th:href="@{/admin/locations/{id}/edit(id=${location.id})}">Edit</a>
                        <a class="btn btn-danger btn-small"
                            th:href="@{/admin/locations/{id}/delete(id=${location.id})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>
</body>

</html>
