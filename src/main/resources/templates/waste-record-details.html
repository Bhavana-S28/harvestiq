<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HarvestIQ helps food-service teams record, understand and reduce food waste through meaningful analytics.">
    <title>HarvestIQ | Waste Record Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div class="container">
            <h1>Waste Record Details</h1>
            <p>View detailed information about a food waste record.</p>
        </div>
    </header>
    <main class="container">
        <nav th:replace="~{fragments/nav :: dashboardNav('waste-records')}"></nav>
        <section class="details-card card">
            <div class="details-item">
                <strong>Food Item:</strong>
                <span th:text="${wasteRecord.foodItem}"></span>
            </div>

            <div class="details-item">
                <strong>Quantity:</strong>
                <span>
                    <span th:text="${#numbers.formatDecimal(wasteRecord.quantity, 1, 1)}"></span> kg
                </span>
            </div>

            <div class="details-item">
                <strong>Waste Category:</strong>
                <span th:text="${wasteRecord.wasteCategory.name}"></span>
            </div>

            <div class="details-item">
                <strong>Waste Reason:</strong>
                <span th:text="${wasteRecord.wasteReason}"></span>
            </div>

            <div class="details-item">
                <strong>Waste Date:</strong>
                <span th:text="${#temporals.format(wasteRecord.wasteDate, 'dd MMM')}"></span>
            </div>

            <div class="details-item">
                <strong>Location:</strong>
                <span th:text="${wasteRecord.location.name}"></span>
            </div>
        </section>

        <div class="page-actions">
            <a class="btn btn-secondary" th:href="@{/waste-records}">Back to Records</a>
            <a class="btn btn-primary" th:href="@{/waste-records/{id}/edit(id=${wasteRecord.id})}">Edit</a>
        </div>

    </main>
</body>
