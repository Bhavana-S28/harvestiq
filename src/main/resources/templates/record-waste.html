<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestIQ | Record Waste</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div class="container">
            <h1 th:text="${wasteRecord.id == null? 'Record Food Waste' : 'Edit Waste Record'}">Record Food Waste</h1>
        </div>
    </header>

    <main class="container">

        <div
            th:replace="~{fragments/nav :: dashboardNav(${wasteRecord.id == null ? 'record-waste' : 'waste-records'})}">
        </div>

        <section id="record-waste">

            <p
                th:text="${wasteRecord.id == null ? 'Enter information about discarded food to create a waste record.' : 'Update the information of this waste record.'}">
            </p>
            <!-- Not needed as it is general errorMessage -->
            <p class="message message-success" th:if="${successMessage}" th:text="${successMessage}">
            </p>

            <!-- <p th:if="${errorMessage}" th:text="${errorMessage}">
            </p> -->

            <form class="card" th:object="${wasteRecord}" th:action="@{/waste}" method="POST">

                <!-- <form th:object="${wasteRecord}" action="#" method="POST"> -->
                <!-- <form action="/waste" method="POST"> -->
                <!-- the form doesn't yet know where to send data because the backend hasn't been built. -->

                <!-- Food Item, Quantity, Date, Email, Estimated Cost, reason -->

                <input type="hidden" th:field="*{id}">
                <!-- The hidden id changes what data is submitted. -->

                <fieldset class="form-section">
                    <legend>Waste Details</legend>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="food-item">Food Item</label>
                            <input th:field="*{foodItem}" type="text" id="food-item" placeholder="Enter the food item">
                            <!-- <input type="text" id="food-item" name="foodItem" placeholder="Enter the food item" required> -->
                            <span class="field-error" th:if="${#fields.hasErrors('foodItem')}"
                                th:errors="*{foodItem}"></span>
                        </div>

                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <!-- by default step value is by 1, but we want to allow decimal values, so we set step="0.1" and min="0.1" to avoid negative values. -->
                            <!-- <input th:field="*{quantity}" type="number" min="0.1" step="0.1" id="quantity"
                        placeholder="Enter the quantity in kg" required> -->

                            <input th:field="*{quantity}" type="number" step="0.1" id="quantity"
                                placeholder="Enter the quantity in kg">
                            <span class="field-error" th:if="${#fields.hasErrors('quantity')}"
                                th:errors="*{quantity}"></span>
                        </div>

                        <div class="form-group">
                            <label for="waste-category">Waste Category</label>
                            <select th:field="*{wasteCategory}" id="waste-category">
                                <option value="">Select a category</option>
                                <option th:each="wasteCategory : ${wasteCategories}" th:text="${wasteCategory.name}"
                                    th:value="${wasteCategory.id}"></option>
                                <!-- <option value="vegetables">Vegetables</option>
                                <option value="fruits">Fruits</option>
                                <option value="dairy">Dairy</option>
                                <option value="bakery">Bakery</option>
                                <option value="beverages">Beverages</option> -->
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('wasteCategory')}"
                                th:errors="*{wasteCategory}"></span>
                        </div>

                        <div class="form-group">
                            <label for="waste-reason">Waste Reason
                                <span class="optional">(Optional)</span>
                            </label>
                            <textarea th:field="*{wasteReason}" id="waste-reason" rows="4"
                                placeholder="Describe the reason for waste"></textarea>
                            <span class="field-error" th:if="${#fields.hasErrors('wasteReason')}"
                                th:errors="*{wasteReason}"></span>
                        </div>
                    </div>
                </fieldset>


                <fieldset class="form-section">
                    <legend>Occurrence Details</legend>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="waste-date">Waste Date</label>
                            <input th:field="*{wasteDate}" type="date" id="waste-date">
                            <span class="field-error" th:if="${#fields.hasErrors('wasteDate')}"
                                th:errors="*{wasteDate}"></span>
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <select th:field="*{location}" id="location">
                                <option value="">Select a location</option>
                                <!-- <option value="1">Dortmund Branch</option>
                        <option value="2">Berlin Branch</option>
                        <option value="3">Munich Branch</option>
                        <option value="4">Hamburg Branch</option> -->
                                <option th:each="location:${restaurantLocations}" th:text="${location.name}"
                                    th:value="${location.id}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('location')}"
                                th:errors="*{location}"></span>
                        </div>
                    </div>
                </fieldset>


                <button class="btn btn-primary" type="submit"
                    th:text="${wasteRecord.id == null ? 'Record Waste' : 'Update Waste'}">Record Waste</button>

                <a th:if="${wasteRecord.id != null}" class="btn btn-secondary"
                    th:href="@{/waste-records/{id}(id=${wasteRecord.id})}">Cancel</a>
            </form>

        </section>

    </main>
</body>

</html>
