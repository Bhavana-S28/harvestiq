<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HarvestIQ helps food-service teams record, understand and reduce food waste through meaningful analytics.">
    <title>HarvestIQ | Delete Category</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div class="container">
            <h1>Delete Category</h1>
        </div>
    </header>

    <main class="container">
        <div class="details-card card">
            <strong>Category Name:</strong>
            <span th:text="${wasteCategory.name}"></span>
        </div>

        <div class="card">
            <p>Are you sure you want to delete this category?</p>

            <form class="page-actions" th:action="@{/admin/categories/{id}/delete(id=${wasteCategory.id})}" method="post">
                <button class="btn btn-danger" type="submit">Delete</button>
                <a class="btn btn-secondary" th:href="@{/admin/categories}">Cancel</a>
            </form>

        </div>



    </main>
</body>

</html>
